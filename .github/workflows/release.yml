name: Create Release

on:
  push:
    tags:
      - '*/v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SYNTH="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "synth=$SYNTH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Load synth map
        id: synth_map
        run: |
          MAP_FILE=".github/synth-map.yml"
          if [[ ! -f "$MAP_FILE" ]]; then
            echo "::error::Missing $MAP_FILE"
            exit 1
          fi
          SOURCE_DIR=$(yq -r ".${{ steps.parse_tag.outputs.synth }}" "$MAP_FILE")
          if [[ -z "$SOURCE_DIR" || "$SOURCE_DIR" == "null" ]]; then
            echo "::error::Synth '${{ steps.parse_tag.outputs.synth }}' not found in $MAP_FILE"
            exit 1
          fi
          echo "source_dir=$SOURCE_DIR" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build zip
        id: build_zip
        run: |
          python scripts/build_zip.py \
            --source-dir "${{ steps.synth_map.outputs.source_dir }}" \
            --synth "${{ steps.parse_tag.outputs.synth }}" \
            --version "${{ steps.parse_tag.outputs.version }}" \
            --output-dir .

      - name: Read release notes
        id: release_notes
        run: |
          NOTES_FILE="release/${{ steps.parse_tag.outputs.synth }}/${{ steps.parse_tag.outputs.version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cat "$NOTES_FILE" > /tmp/release_body.md
          else
            echo "Release ${{ steps.parse_tag.outputs.version }} for ${{ steps.parse_tag.outputs.synth }}" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "_No release notes provided._" >> /tmp/release_body.md
          fi

      - name: Upload screenshots as assets
        id: upload_screenshots
        run: |
          SCREENSHOT_DIR="release/${{ steps.parse_tag.outputs.synth }}/screenshots"
          ASSET_URLS=()
          if [[ -d "$SCREENSHOT_DIR" ]]; then
            for file in "$SCREENSHOT_DIR"/*; do
              [[ -f "$file" ]] || continue
              FILENAME=$(basename "$file")
              UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=${FILENAME}"
              RESPONSE=$(curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: $(file --mime-type -b "$file")" \
                --data-binary @"$file" \
                "$UPLOAD_URL")
              ASSET_URL=$(echo "$RESPONSE" | jq -r '.browser_download_url')
              ASSET_URLS+=("$ASSET_URL")
              echo "Uploaded: $FILENAME -> $ASSET_URL"
            done
          fi
          # Append screenshot markdown to release notes
          for url in "${ASSET_URLS[@]}"; do
            FILENAME=$(basename "$url")
            echo "" >> /tmp/release_body.md
            echo "![${FILENAME}](${url})" >> /tmp/release_body.md
          done

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Simpless-${{ steps.parse_tag.outputs.synth | upper }}-${{ steps.parse_tag.outputs.version }}
          body_path: /tmp/release_body.md
          files: ${{ steps.build_zip.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}