name: Create Release

on:
  push:
    tags:
      - '*/v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SYNTH="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "synth=$SYNTH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Load synth map
        id: synth_map
        run: |
          SYNTH="${{ steps.parse_tag.outputs.synth }}"
          MAP_FILE=".github/synth-map.yml"
          if [[ ! -f "$MAP_FILE" ]]; then
            echo "::error::Missing $MAP_FILE"
            exit 1
          fi
          SOURCE_DIR=$(grep -E "^${SYNTH}:" "$MAP_FILE" | cut -d: -f2 | tr -d ' ')
          if [[ -z "$SOURCE_DIR" ]]; then
            echo "::error::Synth '$SYNTH' not found in $MAP_FILE"
            exit 1
          fi
          echo "source_dir=$SOURCE_DIR" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build zip
        id: build_zip
        run: |
          python scripts/build_zip.py \
            --source-dir "${{ steps.synth_map.outputs.source_dir }}" \
            --synth "${{ steps.parse_tag.outputs.synth }}" \
            --version "${{ steps.parse_tag.outputs.version }}" \
            --output-dir .

      - name: Read release notes
        id: release_notes
        run: |
          NOTES_FILE="release/${{ steps.parse_tag.outputs.synth }}/${{ steps.parse_tag.outputs.version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cat "$NOTES_FILE" > /tmp/release_body.md
          else
            echo "Release ${{ steps.parse_tag.outputs.version }} for ${{ steps.parse_tag.outputs.synth }}" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "_No release notes provided._" >> /tmp/release_body.md
          fi

      - name: Embed screenshots into release body
        id: embed_screenshots
        run: |
          python3 - <<'PYEOF'
          import os, re
          synth = os.environ.get("SYNTH", "${{ steps.parse_tag.outputs.synth }}")
          repo = os.environ.get("REPO", "${{ github.repository }}")
          sha = os.environ.get("SHA", "${{ github.sha }}")
          screenshot_dir = f"release/{synth}/screenshots"
          lines = []
          if os.path.isdir(screenshot_dir):
              for name in sorted(os.listdir(screenshot_dir)):
                  path = os.path.join(screenshot_dir, name)
                  if os.path.isfile(path):
                      url = f"https://github.com/{repo}/blob/{sha}/{screenshot_dir}/{name}?raw=true"
                      lines.append(f"![{name}]({url})")
          img_md = "\n".join(lines)
          with open('/tmp/release_body.md') as f:
              body = f.read()
          if lines:
              body = re.sub(r'<!--.*?-->', img_md, body, count=1, flags=re.DOTALL)
          with open('/tmp/release_body.md', 'w') as f:
              f.write(body)
          print(f"Embedded {len(lines)} screenshots into release body")
        env:
          SYNTH: ${{ steps.parse_tag.outputs.synth }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Simpless-${{ steps.parse_tag.outputs.synth }}-${{ steps.parse_tag.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            ${{ steps.build_zip.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}