name: Create Release

on:
  push:
    tags:
      - '*/v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SYNTH="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "synth=$SYNTH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Load synth map
        id: synth_map
        run: |
          SYNTH="${{ steps.parse_tag.outputs.synth }}"
          MAP_FILE=".github/synth-map.yml"
          if [[ ! -f "$MAP_FILE" ]]; then
            echo "::error::Missing $MAP_FILE"
            exit 1
          fi
          SOURCE_DIR=$(grep -E "^${SYNTH}:" "$MAP_FILE" | cut -d: -f2 | tr -d ' ')
          if [[ -z "$SOURCE_DIR" ]]; then
            echo "::error::Synth '$SYNTH' not found in $MAP_FILE"
            exit 1
          fi
          echo "source_dir=$SOURCE_DIR" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build zip
        id: build_zip
        run: |
          python scripts/build_zip.py \
            --source-dir "${{ steps.synth_map.outputs.source_dir }}" \
            --synth "${{ steps.parse_tag.outputs.synth }}" \
            --version "${{ steps.parse_tag.outputs.version }}" \
            --output-dir .

      - name: Read release notes
        id: release_notes
        run: |
          NOTES_FILE="release/${{ steps.parse_tag.outputs.synth }}/${{ steps.parse_tag.outputs.version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cat "$NOTES_FILE" > /tmp/release_body.md
          else
            echo "Release ${{ steps.parse_tag.outputs.version }} for ${{ steps.parse_tag.outputs.synth }}" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "_No release notes provided._" >> /tmp/release_body.md
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Simpless-${{ steps.parse_tag.outputs.synth }}-${{ steps.parse_tag.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            ${{ steps.build_zip.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots as assets and update release body
        id: upload_screenshots
        run: |
          SYNTH="${{ steps.parse_tag.outputs.synth }}"
          RELEASE_ID="${{ steps.create_release.outputs.release_id }}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          SCREENSHOT_DIR="release/${SYNTH}/screenshots"

          if [[ ! -d "$SCREENSHOT_DIR" ]]; then
            echo "No screenshots directory, skipping"
            exit 0
          fi

          # Upload all screenshots as assets
          echo "Uploading screenshots via gh CLI..."
          gh release upload "${TAG}" "${SCREENSHOT_DIR}"/* --clobber --repo "${REPO}"

          # Get asset URLs from release API
          SCREENSHOT_URLS=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            --jq '.assets[] | select(.name | test("\\.(png|jpg|jpeg|gif)$")) | .browser_download_url')

          if [[ -z "$SCREENSHOT_URLS" ]]; then
            echo "No screenshot assets found, skipping body update"
            exit 0
          fi

          # Build markdown for screenshots section
          IMG_BLOCK="
## Screenshots

"
          while IFS= read -r url; do
            FILENAME=$(basename "$url")
            IMG_BLOCK="${IMG_BLOCK}![${FILENAME}](${url})\n"
          done <<< "$SCREENSHOT_URLS"

          # Read current body, append screenshots
          cp /tmp/release_body.md /tmp/release_body_final.md
          sed -i '/<!--.*screenshots.*-->/Id' /tmp/release_body_final.md
          echo -e "\n${IMG_BLOCK}" >> /tmp/release_body_final.md

          # Update release body
          BODY_JSON=$(python3 -c "import json,sys; print(json.dumps({'body': open('/tmp/release_body_final.md').read()}))")
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "${BODY_JSON}" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}"

          echo "Release body updated with screenshots"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}