name: Create Release

on:
  push:
    tags:
      - '*/v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SYNTH="${TAG%%/*}"
          VERSION="${TAG#*/}"
          echo "synth=$SYNTH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Load synth map
        id: synth_map
        run: |
          SYNTH="${{ steps.parse_tag.outputs.synth }}"
          MAP_FILE=".github/synth-map.yml"
          if [[ ! -f "$MAP_FILE" ]]; then
            echo "::error::Missing $MAP_FILE"
            exit 1
          fi
          SOURCE_DIR=$(grep -E "^${SYNTH}:" "$MAP_FILE" | cut -d: -f2 | tr -d ' ')
          if [[ -z "$SOURCE_DIR" ]]; then
            echo "::error::Synth '$SYNTH' not found in $MAP_FILE"
            exit 1
          fi
          echo "source_dir=$SOURCE_DIR" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build zip
        id: build_zip
        run: |
          python scripts/build_zip.py \
            --source-dir "${{ steps.synth_map.outputs.source_dir }}" \
            --synth "${{ steps.parse_tag.outputs.synth }}" \
            --version "${{ steps.parse_tag.outputs.version }}" \
            --output-dir .

      - name: Read release notes
        id: release_notes
        run: |
          NOTES_FILE="release/${{ steps.parse_tag.outputs.synth }}/${{ steps.parse_tag.outputs.version }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cat "$NOTES_FILE" > /tmp/release_body.md
          else
            echo "Release ${{ steps.parse_tag.outputs.version }} for ${{ steps.parse_tag.outputs.synth }}" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "_No release notes provided._" >> /tmp/release_body.md
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Simpless-${{ steps.parse_tag.outputs.synth }}-${{ steps.parse_tag.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            ${{ steps.build_zip.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots as assets and update release body
        id: upload_screenshots
        run: |
          SYNTH="${{ steps.parse_tag.outputs.synth }}"
          RELEASE_ID="${{ steps.create_release.outputs.release_id }}"
          REPO="${{ github.repository }}"
          SCREENSHOT_DIR="release/${SYNTH}/screenshots"

          if [[ ! -d "$SCREENSHOT_DIR" ]]; then
            echo "No screenshots directory, skipping"
            exit 0
          fi

          SCREENSHOT_MD=""
          for file in "$SCREENSHOT_DIR"/*; do
            [[ -f "$file" ]] || continue
            FILENAME=$(basename "$file")
            echo "Uploading: $FILENAME"

            UPLOAD_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: $(file --mime-type -b "$file")" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${FILENAME}")

            ASSET_URL=$(echo "$UPLOAD_RESPONSE" | grep -o '"browser_download_url": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/')

            if [[ -z "$ASSET_URL" ]]; then
              echo "::error::Failed to upload $FILENAME"
              echo "$UPLOAD_RESPONSE"
              exit 1
            fi

            echo "Uploaded: $FILENAME -> $ASSET_URL"
            SCREENSHOT_MD="${SCREENSHOT_MD}\n![${FILENAME}](${ASSET_URL})"
          done

          if [[ -n "$SCREENSHOT_MD" ]]; then
            # Insert screenshots after the body text, before any existing screenshots comment
            IMG_BLOCK="\n## Screenshots\n${SCREENSHOT_MD}\n"

            # Read current body
            cp /tmp/release_body.md /tmp/release_body_final.md

            # Remove any existing screenshots comment
            sed -i '/<!--.*screenshots.*-->/Id' /tmp/release_body_final.md

            # Append screenshots section
            echo -e "$IMG_BLOCK" >> /tmp/release_body_final.md

            # Update release body
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'body': open('/tmp/release_body_final.md').read()}))")" \
              "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}"

            echo "Release body updated with screenshots"
          fi